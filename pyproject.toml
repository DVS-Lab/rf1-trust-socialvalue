[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rf1-trust-socialvalue"
version = "0.1.0"
description = "Audited behavioral and computational analysis of ds005123 v1.1.3"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.14", "statsmodels>=0.14", "matplotlib>=3.9", "numba>=0.61", "joblib>=1.4"]

[project.optional-dependencies]
test = ["pytest>=8"]
hierarchical = ["cmdstanpy>=1.3,<2", "arviz>=0.23,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
